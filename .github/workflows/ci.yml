name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fonts — OFL only + checksums
        run: node scripts/check-fonts.mjs && bash scripts/install-fonts.sh
      - name: typecheck
        run: pnpm -r --if-present typecheck
      - name: unit tests (Persian text, captions, sync, guard)
        run: pnpm --filter @amf/pipeline test
      - name: build web panel + worker (dry run)
        run: |
          pnpm --filter @amf/worker build:panel
          pnpm --filter @amf/worker exec wrangler deploy --dry-run --outdir /tmp/worker-build
      - name: font proof still (fails if any face does not load)
        run: |
          pnpm --filter @amf/engine exec remotion browser ensure
          cd engine && node --experimental-strip-types --no-warnings scripts/stills.mjs /tmp/proof FontProof:0
      - uses: actions/upload-artifact@v7
        with:
          name: font-proof
          path: /tmp/proof
          retention-days: 7

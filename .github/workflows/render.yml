name: render
# Started by dispatcher.yml (it claims the Worker's render queue). One job stage per run.
# Job state: small JSON in the Worker's Durable Object, media + resumable state as Release assets (tag job-<id>).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id (yyyymmdd-xxxxxx)
        required: true
      stage:
        description: script | preview | final
        required: true
        type: choice
        options: [script, preview, final]
permissions:
  contents: write # create the job-<id> pre-release and upload its assets
concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false
env:
  JOB: ${{ inputs.job_id }}
  STAGE: ${{ inputs.stage }}
  AMF_WORK: ${{ github.workspace }}/.work
  AMF_PUBLIC_URL: ${{ vars.AMF_PUBLIC_URL || 'https://ali-motion-factory.ali-bitcoin666.workers.dev' }}
  CALLBACK_URL: ${{ vars.AMF_PUBLIC_URL || 'https://ali-motion-factory.ali-bitcoin666.workers.dev' }}/cb/github
  CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
  GH_TOKEN: ${{ github.token }}
  FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED || 'true' }}
defaults:
  run:
    shell: bash
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: validate inputs
        run: |
          [[ "$JOB" =~ ^[0-9]{8}-[0-9a-z]{6}$ ]] || { echo "::error::bad job id"; exit 1; }
      - uses: actions/checkout@v7
      - name: pull job state (Worker blobs + release state.tgz)
        run: node scripts/job-sync.mjs pull "$AMF_WORK/jobs/$JOB"
      - name: guard (protected channels, kill switch)
        run: node scripts/guard-request.mjs "$AMF_WORK/jobs/$JOB"
      - run: node scripts/callback.mjs "$JOB" "$STAGE" running
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        if: inputs.stage != 'script'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/py/requirements.txt
      - name: python deps (CPU torch)
        if: inputs.stage != 'script'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r pipeline/py/requirements.txt
          echo "AMF_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        if: inputs.stage != 'script'
        with:
          path: ~/.cache/huggingface
          key: hf-wav2vec2-fa-whisper-v1 # gitleaks:allow (cache key, not a secret)
      - name: ffmpeg + fonts + headless Chrome
        if: inputs.stage != 'script'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig >/dev/null
          bash scripts/install-fonts.sh
          pnpm --filter @amf/engine exec remotion browser ensure
      - name: script (Gemini → zod, one auto-repair; Workers AI if no Gemini key)
        if: inputs.stage == 'script'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: pipeline
        run: npx tsx src/cli.ts script --id "$JOB" --request "$AMF_WORK/jobs/$JOB/request.json" --edits "$AMF_WORK/jobs/$JOB/edits.json" 2>&1 | tee "$RUNNER_TEMP/stage.log"
      - name: images (flux-1-schnell on Workers AI, no text)
        if: inputs.stage == 'preview'
        run: node scripts/flux-assets.mjs "$AMF_WORK/jobs/$JOB" || echo "::warning::image generation skipped — SVG visuals are used"
      - name: produce ${{ inputs.stage }}
        if: inputs.stage != 'script'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMF_WHISPER_MODEL: large-v3-turbo
        working-directory: pipeline
        run: |
          set -o pipefail
          FPS=$(node -e "const r=require('$AMF_WORK/jobs/$JOB/request.json');console.log(r.fps||30)")
          K4=$(node -e "const r=require('$AMF_WORK/jobs/$JOB/request.json');console.log(r.quality==='4k'?'--4k':'')")
          npx tsx src/cli.ts produce --id "$JOB" --stage "$STAGE" --fps "$FPS" $K4 --owner-approved 2>&1 | tee "$RUNNER_TEMP/stage.log"
      - name: Google Drive (final only, optional)
        if: inputs.stage == 'final' && success()
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/drive-upload.mjs "$AMF_WORK/jobs/$JOB" >> "$GITHUB_ENV" || echo "::warning::Drive upload skipped"
      - name: publish job (release assets + Worker links)
        if: always()
        run: node scripts/job-sync.mjs push "$AMF_WORK/jobs/$JOB" "$STAGE"
      - name: callback ok
        if: success()
        run: node scripts/callback.mjs "$JOB" "$STAGE" ok "" "$AMF_WORK/jobs/$JOB/qa/report.json"
      - name: callback failed
        if: failure()
        run: node scripts/callback.mjs "$JOB" "$STAGE" failed "$RUNNER_TEMP/stage.log" "$AMF_WORK/jobs/$JOB/qa/report.json"

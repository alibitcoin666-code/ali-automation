name: cleanup
# Removes bulky intermediates from job releases older than 30 days: resumable state (state.tgz) and the 720p preview.
# Final MP4s, thumbnails, SRT and metadata stay.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 0"
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: delete intermediates older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName -q '.[].tagName' | while read -r tag; do
            [[ "$tag" =~ ^job-([0-9]{8})- ]] || continue
            [[ "${BASH_REMATCH[1]}" < "$cutoff" ]] || continue
            for a in state.tgz out__preview-720p.mp4; do gh release delete-asset "$tag" "$a" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true; done
            echo "cleaned $tag"
          done
